# The Slack app the FPL bot posts as: its own app, separate from the ESPN bot's "Fantasy Bot", so each
# has its own token, signing secret and (later) tap address. Paste this at api.slack.com/apps >
# Create New App > From a manifest (README, "Slack"). chat:write lets it post to channels it has been
# invited to. The Yes/No buttons, overrides and /fpl come later (Phase 2 and 3 in the design notes).
display_information:
  name: Fantasy Premier League Bot
  description: Previews, decisions and results for your Fantasy Premier League team.
features:
  bot_user:
    display_name: Fantasy Premier League Bot
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
