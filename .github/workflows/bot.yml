name: Bot

# cron-job.org starts a "tick" every 30 minutes (timers.py); each tick runs whichever job is due
# before FPL's next deadline (schedule.py): preview ~24 h before, main run ~2 h, final check ~45 min.
# Run workflow by hand for a dry run (emailed) or any single job. Every push to main runs the tests
# and a dry run without the email. Nothing is sent to FPL unless the repository variable BOT_LIVE
# is "true". GitHub's own schedule isn't used: it started the ESPN bot's runs hours late.
on:
  workflow_dispatch:
    inputs:
      job:
        description: Which job (cron-job.org sends tick)
        type: choice
        options: [dry-run, tick, preview, main, final, check-write, explain, slack-check]
        default: dry-run
      player:
        description: For explain, the player's name as FPL shows it (e.g. Haaland)
        type: string
        default: ""
      email:
        description: Send the dry run (Slack, and email while EMAIL_TOO is true)
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: write     # to save state (encrypted login, schedule, write log) to the bot-state branch

concurrency:
  # One run at a time: two runs would both try to renew the login. Explain and slack-check runs don't
  # log in, so they run alongside (and can't knock a queued tick out of the queue).
  group: ${{ (inputs.job == 'explain' || inputs.job == 'slack-check') && format('{0}-{1}', inputs.job, github.run_id) || 'fpl' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - if: github.event_name == 'push'
        run: python -m pytest -q
      - name: Explain a projection
        if: inputs.job == 'explain'
        run: python explain.py "$PLAYER" ${FPL_TEAM_ID:+--team "$FPL_TEAM_ID"}
        env:
          PLAYER: ${{ inputs.player }}
          FPL_TEAM_ID: ${{ vars.FPL_TEAM_ID }}
      - name: Check the Slack buttons (run it, tap Yes or No in Slack, run it again)
        if: inputs.job == 'slack-check'
        run: python approvals.py --slack-check
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
      - name: Bot
        if: inputs.job != 'explain' && inputs.job != 'slack-check'
        run: bash hosted_run.sh --job "${JOB:-dry-run}" ${{ (github.event_name == 'workflow_dispatch' && inputs.job == 'dry-run' && inputs.email) && '--email' || '' }}
        env:
          JOB: ${{ inputs.job }}
          BOT_LIVE: ${{ vars.BOT_LIVE }}
          FPL_TEAM_ID: ${{ vars.FPL_TEAM_ID }}
          FPL_REFRESH_TOKEN: ${{ secrets.FPL_REFRESH_TOKEN }}
          FPL_STATE_KEY: ${{ secrets.FPL_STATE_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          SLACK_USER_ID: ${{ vars.SLACK_USER_ID }}     # your member ID: alerts @-mention you
          EMAIL_TOO: ${{ vars.EMAIL_TOO }}             # "true" while Slack is on trial: email as well
